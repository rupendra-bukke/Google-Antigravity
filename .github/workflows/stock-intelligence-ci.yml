name: Stock Intelligence CI

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "web-app-dev/stock-intelligence-app/**"
      - ".github/workflows/stock-intelligence-ci.yml"
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "web-app-dev/stock-intelligence-app/**"
      - ".github/workflows/stock-intelligence-ci.yml"

jobs:
  backend-check:
    name: Backend syntax check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app-dev/stock-intelligence-app/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python sources
        run: python -m compileall -q .

  frontend-check:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app-dev/stock-intelligence-app/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-app-dev/stock-intelligence-app/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit
