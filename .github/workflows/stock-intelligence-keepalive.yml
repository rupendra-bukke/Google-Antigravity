name: Stock Intelligence Keepalive

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: Which backend to ping
        required: true
        default: prod
        type: choice
        options:
          - prod
          - dev
          - both

  schedule:
    # Mon/Wed/Fri 04:15 UTC (~09:45 IST) — stays inside Supabase's ~7-day inactivity window
    - cron: "15 4 * * 1,3,5"

permissions:
  contents: read

concurrency:
  group: stock-intelligence-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Resolve targets
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TARGET: ${{ github.event.inputs.target_env }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "schedule" ]]; then
            echo "targets=prod,dev" >> "$GITHUB_OUTPUT"
          else
            case "${INPUT_TARGET}" in
              prod) echo "targets=prod" >> "$GITHUB_OUTPUT" ;;
              dev) echo "targets=dev" >> "$GITHUB_OUTPUT" ;;
              both) echo "targets=prod,dev" >> "$GITHUB_OUTPUT" ;;
              *) echo "Unknown target: ${INPUT_TARGET}"; exit 1 ;;
            esac
          fi

      - name: Ping backends
        shell: bash
        env:
          DEV_BASE_URL: ${{ secrets.CHECKPOINT_CRON_DEV_BASE_URL }}
          DEV_SECRET: ${{ secrets.CHECKPOINT_CRON_DEV_SECRET }}
          PROD_BASE_URL: ${{ secrets.CHECKPOINT_CRON_PROD_BASE_URL }}
          PROD_SECRET: ${{ secrets.CHECKPOINT_CRON_PROD_SECRET }}
          TARGETS: ${{ steps.resolve.outputs.targets }}
        run: |
          set -euo pipefail

          ping_env() {
            local env_name="$1"
            local base_url="$2"
            local cron_secret="$3"

            base_url="${base_url%/}"
            if [[ -z "$base_url" || -z "$cron_secret" ]]; then
              echo "Skipping ${env_name}: missing base URL or cron secret."
              return 0
            fi

            echo "::add-mask::${cron_secret}"
            echo "=== Keepalive: ${env_name} (${base_url}) ==="

            health_status=$(curl --silent --show-error --output health.json --write-out "%{http_code}" \
              --max-time 60 \
              "${base_url}/health" || true)

            if [[ "$health_status" != "200" ]]; then
              echo "Wake/health failed for ${env_name} with status ${health_status:-curl_error}"
              cat health.json || true

              for attempt in {1..6}; do
                echo "Retry wake ${attempt}/6 for ${env_name}"
                sleep 20
                health_status=$(curl --silent --show-error --output health.json --write-out "%{http_code}" \
                  --max-time 60 \
                  "${base_url}/health" || true)
                if [[ "$health_status" == "200" ]]; then
                  break
                fi
              done
            fi

            if [[ "$health_status" != "200" ]]; then
              echo "Backend ${env_name} did not become healthy."
              exit 1
            fi

            cat health.json
            echo ""

            keepalive_status=$(curl --silent --show-error --output keepalive.json --write-out "%{http_code}" \
              --max-time 60 \
              --header "X-Checkpoint-Cron-Secret: ${cron_secret}" \
              "${base_url}/health/keepalive" || true)

            cat keepalive.json
            echo ""

            if [[ "$keepalive_status" != "200" ]]; then
              echo "Keepalive endpoint failed for ${env_name} with status ${keepalive_status:-curl_error}"
              exit 1
            fi

            if ! grep -q '"status"[[:space:]]*:[[:space:]]*"ok"' keepalive.json; then
              echo "Keepalive returned degraded status for ${env_name}"
              exit 1
            fi

            echo "Keepalive succeeded for ${env_name}"
          }

          IFS=',' read -r -a target_list <<< "${TARGETS}"
          for target in "${target_list[@]}"; do
            case "$target" in
              prod) ping_env "prod" "$PROD_BASE_URL" "$PROD_SECRET" ;;
              dev) ping_env "dev" "$DEV_BASE_URL" "$DEV_SECRET" ;;
            esac
          done
